<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solar System</title>
    <link rel="stylesheet" href="sol2.css" />
  </head>
  <body>
    <main class="scene">
      <div id="solar-system" aria-label="Animated model of the solar system">
        <div class="sun" aria-label="The Sun">
          <img src="images/download__1_-removebg-preview.png" alt="The Sun" />
        </div>

        <div class="orbit mercury">
          <div class="planet">
            <img src="images/Mercury___The_Swiftest_Planet_in_the_Solar_System-removebg-preview.png" alt="Mercury" />
            <span class="label">Mercury</span>
          </div>
        </div>

        <div class="orbit venus">
          <div class="planet">
            <img src="images/Did_you_know__A_day_on_venus_is_longer_than_its_year___-removebg-preview.png" alt="Venus" />
            <span class="label">Venus</span>
          </div>
        </div>

        <div class="orbit earth">
          <div class="planet">
            <img src="images/Earth_____Nature__Balance___Planet_Inspiration-removebg-preview.png" alt="Earth" />
            <span class="label">Earth</span>
            <div class="moon-orbit">
              <div class="moon" aria-hidden="true"></div>
            </div>
          </div>
        </div>

        <div class="orbit mars">
          <div class="planet">
            <img src="images/download__4_-removebg-preview.png" alt="Mars" />
            <span class="label">Mars</span>
            <div class="moon-orbit moon-orbit--phobos">
              <div class="moon phobos" aria-hidden="true"></div>
            </div>
            <div class="moon-orbit moon-orbit--deimos">
              <div class="moon deimos" aria-hidden="true"></div>
            </div>
          </div>
        </div>

        <div class="orbit jupiter">
          <div class="planet">
            <img src="images/Jupiter-removebg-preview.png" alt="Jupiter" />
            <span class="label">Jupiter</span>
          </div>
        </div>

        <div class="orbit saturn">
          <div class="planet">
            <img src="images/download__3_-removebg-preview.png" alt="Saturn" />
            <span class="label">Saturn</span>
          </div>
        </div>

        <div class="orbit uranus">
          <div class="planet">
            <img src="images/Uranus_Aesthetic_Wallpaper_HD___Space_Exploration_Pin___Fact_Blizz-removebg-preview.png" alt="Uranus" />
            <span class="label">Uranus</span>
          </div>
        </div>

        <div class="orbit neptune">
          <div class="planet">
            <img src="images/download__2_-removebg-preview.png" alt="Neptune" />
            <span class="label">Neptune</span>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
